<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SLT 1.0 Live Transcription</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; text-align: center; }
        #recordBtn { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        #recordBtn.recording { background-color: #dc3545; }
        #transcriptBox { margin-top: 30px; padding: 20px; border: 1px solid #ccc; height: 300px; overflow-y: auto; text-align: left; background: #f8f9fa; border-radius: 5px; }
        .segment { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <h2>SLT 1.0 Real-Time Transcriber</h2>
    <p>Press the button and speak into your microphone.</p>
    
    <button id="recordBtn">Start Live Recording</button>
    
    <div id="transcriptBox">
        <em style="color: #888;">Live text will appear here...</em>
    </div>

    <script>
    let ws;
    let mediaRecorder;
    let isRecording = false;
    const recordBtn = document.getElementById('recordBtn');
    const transcriptBox = document.getElementById('transcriptBox');

    recordBtn.addEventListener('click', async () => {
        // Stop logic
        if (isRecording) {
            isRecording = false;
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            if (ws) ws.close();
            recordBtn.textContent = 'Start Live Recording';
            recordBtn.classList.remove('recording');
            return;
        }

        // Start logic
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            ws = new WebSocket('ws://127.0.0.1:8000/stream');
            
            ws.onopen = () => {
                console.log('Connected to backend stream');
                isRecording = true;
                recordBtn.textContent = 'Stop Recording';
                recordBtn.classList.add('recording');
                transcriptBox.innerHTML = ''; 

                // Function to record in perfectly formed 3-second blocks
                const startRecordingCycle = () => {
                    if (!isRecording) return;
                    
                    mediaRecorder = new MediaRecorder(stream);
                    let audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        if (ws.readyState === WebSocket.OPEN && audioChunks.length > 0) {
                            // Package into a valid WEBM file and send to Python
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            ws.send(audioBlob);
                        }
                        // Instantly loop and start the next 3 seconds
                        if (isRecording) startRecordingCycle();
                    };

                    mediaRecorder.start();
                    
                    // Stop this chunk after 15 seconds to respect the API 5-request limit
                    setTimeout(() => {
                        if (mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 15000);
                };

                startRecordingCycle();
            };

            ws.onmessage = (event) => {
                const response = JSON.parse(event.data);
                if (response.status === 'success') {
                    const newSegment = document.createElement('div');
                    newSegment.className = 'segment';
                    newSegment.innerHTML = `<strong>[${response.language}]</strong>: ${response.text}`;
                    transcriptBox.appendChild(newSegment);
                    transcriptBox.scrollTop = transcriptBox.scrollHeight;
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
                alert('Connection lost. Is the FastAPI server running?');
            };

        } catch (err) {
            console.error('Microphone error:', err);
            alert('Could not access microphone.');
        }
    });
    </script>
</body>
</html>
